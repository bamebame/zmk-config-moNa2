#Mouse config ---------------------
# 軸の反転・入れ替えは PAW3222 では overlay 側で行う
# (zip_xy_transform INPUT_TRANSFORM_X_INVERT などの入力プロセッサを使う)

#Encoder config -------------------
# 右半体にエンコーダーは無いので EC11 ドライバは不要。
# 追加するときは mona2_r.overlay に alps,ec11 のノードを定義し、
# mona2.dtsi の sensors に登録してからここを戻す。

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
# ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING / _PROXY は無効にする。
#
# ZMK (v0.3 / 上流 main の両方) には未修正の不具合がある:
#   split_central_disconnected() にロール判定が無く、PC との切断でも発火する。
#   peripheral_slot_index_for_conn() が返す -EINVAL(-22) が uint8_t で 234 に
#   化け、要素1個の peripheral_battery_levels[234] へ書き込む。
#   → PC と切断するたびに .bss を 1 バイト壊す。
#   https://github.com/zmkfirmware/zmk/issues/3522
#
# OOB 書き込みは _FETCHING 配下にあるため、_PROXY だけ n にしても
# バグは残り、唯一の証拠である警告ログが消えるだけ。_FETCHING を切る。
# _PROXY は Kconfig 上 _FETCHING の if 内なので自動的に無効になる。
#
# 失うのは「ホストから見える相手側半体の電池残量」だけ。
# rgbled-widget は choice の既定が BATTERY_SHOW_SELF なので影響しない
# (BATTERY_SHOW_PERIPHERALS を選ぶと _FETCHING を select し直すので注意)。

#Layer LED config -------------------
# BATTERY_LEVEL_HIGH / _CRITICAL は boards/shields/mona2/Kconfig.defconfig で
# 左右両方に default 30 / 10 を入れているため、ここでは指定しない。
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# PAW3222 にはダウンシフト時間の Kconfig が無い。
# 省電力の挙動を変えたい場合は overlay の force-awake プロパティを使う。

# ========================================
# BLE リンクの安定化 (zmk-config-Keyball44 / CLine46 と同じ設定)
# ========================================
# 送信出力を +8dBm に。既定は 0dBm。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2M PHY を無効化する (この Kconfig の現在の効果はそれだけ)。
# 2M PHY は速い代わりに受信感度が 1M PHY より約 6dB 悪く、距離とノイズに弱い。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 送信バッファ。Zephyr の既定は ACL_TX=3。L2CAP_TX は Zephyr 既定 3 だが、
# ZMK は central に限り `default 5 if ZMK_SPLIT_ROLE_CENTRAL` を入れている。
# マウスレポートは高頻度なので、接続イベントを取りこぼすとすぐ溢れる。
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# ========================================
# ディープスリープ (zmk-config-CLine46-zmk41 と同じ設定に統一)
# ========================================
# 復帰は各半体のキー押下。mona2.dtsi の kscan0 に wakeup-source を
# 付けていないと、スリープ前に kscan ごと suspend されてキーで復帰できない。
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
