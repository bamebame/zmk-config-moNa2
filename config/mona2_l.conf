#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ========================================
# BLE リンクの安定化 (zmk-config-Keyball44 / CLine46 と同じ設定)
# ========================================
# 送信出力を +8dBm に。既定は 0dBm。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2M PHY を無効化する (この Kconfig の現在の効果はそれだけ)。
# 2M PHY は速い代わりに受信感度が 1M PHY より約 6dB 悪く、距離とノイズに弱い。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 送信バッファ。Zephyr の既定は ACL_TX=3 で L2CAP_TX もそれに追従して 3。
# マウスレポートは高頻度なので、接続イベントを取りこぼすとすぐ溢れる。
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
