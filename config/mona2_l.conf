#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
# ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING / _PROXY は ZMK 側で
# `if ZMK_SPLIT_ROLE_CENTRAL` の中にある。左は peripheral なので依存を
# 満たさず、ここで y を指定しても Kconfig 警告が出て値は n になる。
# central 側 (config/mona2_r.conf) だけで指定する。

# ========================================
# BLE リンクの安定化 (zmk-config-Keyball44 / CLine46 と同じ設定)
# ========================================
# 送信出力を +8dBm に。既定は 0dBm。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2M PHY を無効化する (この Kconfig の現在の効果はそれだけ)。
# 2M PHY は速い代わりに受信感度が 1M PHY より約 6dB 悪く、距離とノイズに弱い。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 送信バッファの増量 (BT_BUF_ACL_TX_COUNT / BT_BUF_EVT_RX_COUNT /
# BT_L2CAP_TX_BUF_COUNT) は central 側 (config/mona2_r.conf) のみに置く。
# 高頻度で溢れるのはホストへ送るマウスレポートであり、左が central へ送るのは
# キー位置の通知だけなので Zephyr 既定で足りる。左で増やすと RAM を削るだけ。

# ========================================
# ディープスリープ (zmk-config-CLine46-zmk41 と同じ設定に統一)
# ========================================
# 復帰は各半体のキー押下。mona2.dtsi の kscan0 に wakeup-source を
# 付けていないと、スリープ前に kscan ごと suspend されてキーで復帰できない。
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
